<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St Ives · Location Report — Harbour &amp; Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --ink:#1C1C1A;
    --ink-soft:#4A4A46;
    --hair:#D9D9D4;
    --hair-soft:#E6E6E1;
    --accent:#0E5A57;
    --accent-deep:#0A413F;
    --backdrop:#E8E8E6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--backdrop);}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;justify-content:center;
    padding:24px;
  }
  .page{
    position:relative;
    width:210mm;height:297mm;
    background:var(--paper);
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.14);
    overflow:hidden;
  }
  .serif{font-family:'Fraunces',Georgia,serif;}

  .cover{padding:24mm 24mm 18mm;display:flex;flex-direction:column;height:100%;}

  /* ---------- masthead ---------- */
  .masthead{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .masthead .mark{
    font-size:24px;letter-spacing:.30em;font-weight:500;
    color:var(--accent-deep);text-transform:uppercase;padding-right:.30em;
  }
  .masthead .tagline{
    margin-top:9px;font-size:10px;letter-spacing:.05em;color:var(--ink-soft);
  }
  .masthead .tagline::before,.masthead .tagline::after{
    content:"";display:inline-block;width:26px;height:1px;
    background:var(--hair);vertical-align:middle;margin:0 12px;
  }

  /* ---------- hero coastline motif ---------- */
  .hero{margin-top:10mm;}
  .hero svg{display:block;width:100%;height:auto;}

  /* ---------- title ---------- */
  .title{margin-top:12mm;text-align:center;}
  .title .kicker{
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:16px;
  }
  .title h1{
    font-family:'Fraunces',serif;font-weight:400;
    font-size:92px;line-height:.92;letter-spacing:-.05em;
    color:var(--ink);
  }
  .title .sub{
    margin-top:18px;font-size:13.5px;letter-spacing:.06em;color:var(--ink-soft);
  }

  /* ---------- quiet facts line ---------- */
  .facts{
    margin-top:auto;padding-top:18px;border-top:1px solid var(--hair);
    text-align:center;font-size:11px;letter-spacing:.015em;
    color:var(--ink-soft);line-height:1.7;
  }
  .facts .dot{color:var(--accent);margin:0 11px;font-weight:600;}
  .facts b{color:var(--ink);font-weight:500;}

  /* ---------- footer ---------- */
  .foot{
    margin-top:16px;display:flex;justify-content:space-between;align-items:baseline;
    font-size:9px;letter-spacing:.05em;color:var(--ink-soft);
  }
  .foot .credit b{font-weight:600;color:var(--ink);}

  @page{size:A4;margin:0;}
  @media print{
    body{background:#fff;padding:0;}
    .page{box-shadow:none;}
  }
</style>
</head>
<body>

<section class="page">
  <div class="cover">

    <div class="masthead">
      <div class="mark serif">Harbour &amp; Stone</div>
      <div class="tagline">Fine Coastal Homes · Cornwall</div>
    </div>

    <!-- ===== Hero: hand-built St Ives coastline as topographic contours ===== -->
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- one hand-drawn St Ives coastline, repeated & offset to read as a topographic field -->
          <path id="coast"
            d="M -60 372
               C 150 364 256 312 392 304
               C 506 297 590 344 712 354
               C 812 362 918 348 1060 328"/>
        </defs>

        <g fill="none" stroke="#0E5A57" stroke-linecap="round">
          <!-- open Atlantic: bathymetry stepping seaward — faint far out, firmer toward shore -->
          <use href="#coast" transform="translate(0,-264)" opacity=".07" stroke-width="1"/>
          <use href="#coast" transform="translate(0,-228)" opacity=".09" stroke-width="1"/>
          <use href="#coast" transform="translate(0,-192)" opacity=".11" stroke-width="1"/>
          <use href="#coast" transform="translate(0,-156)" opacity=".14" stroke-width="1.1"/>
          <use href="#coast" transform="translate(0,-120)" opacity=".18" stroke-width="1.1"/>
          <use href="#coast" transform="translate(0,-84)"  opacity=".24" stroke-width="1.2"/>
          <use href="#coast" transform="translate(0,-48)"  opacity=".34" stroke-width="1.3"/>
          <use href="#coast" transform="translate(0,-24)"  opacity=".50" stroke-width="1.4"/>
          <!-- the shoreline — the one firm engraved line -->
          <use href="#coast" transform="translate(0,0)"    opacity=".92" stroke-width="2.2"/>
          <!-- land — elevation contours rising inland -->
          <use href="#coast" transform="translate(0,26)"   opacity=".55" stroke-width="1.5"/>
          <use href="#coast" transform="translate(0,54)"   opacity=".40" stroke-width="1.3"/>
          <use href="#coast" transform="translate(0,84)"   opacity=".30" stroke-width="1.2"/>
          <use href="#coast" transform="translate(0,116)"  opacity=".22" stroke-width="1.1"/>
          <use href="#coast" transform="translate(0,150)"  opacity=".16" stroke-width="1"/>
          <use href="#coast" transform="translate(0,186)"  opacity=".11" stroke-width="1"/>
          <use href="#coast" transform="translate(0,224)"  opacity=".08" stroke-width="1"/>
        </g>

        <!-- The Island: concentric summit contours over the headland -->
        <g fill="none" stroke="#0E5A57" transform="rotate(-10 360 250)">
          <ellipse cx="360" cy="250" rx="118" ry="56" opacity=".12" stroke-width="1.1"/>
          <ellipse cx="360" cy="250" rx="92"  ry="44" opacity=".18" stroke-width="1.1"/>
          <ellipse cx="360" cy="250" rx="68"  ry="32" opacity=".26" stroke-width="1.2"/>
          <ellipse cx="360" cy="250" rx="45"  ry="21" opacity=".36" stroke-width="1.3"/>
          <ellipse cx="360" cy="250" rx="24"  ry="11" opacity=".52" stroke-width="1.4"/>
        </g>
        <circle cx="360" cy="250" r="3.2" fill="#0E5A57" opacity=".7"/>

        <!-- inland elevation: the town hill rising behind the harbour -->
        <g fill="none" stroke="#0E5A57" transform="rotate(7 726 470)">
          <ellipse cx="726" cy="470" rx="98" ry="46" opacity=".10" stroke-width="1"/>
          <ellipse cx="726" cy="470" rx="72" ry="33" opacity=".15" stroke-width="1.1"/>
          <ellipse cx="726" cy="470" rx="47" ry="22" opacity=".21" stroke-width="1.1"/>
          <ellipse cx="726" cy="470" rx="24" ry="11" opacity=".28" stroke-width="1.2"/>
        </g>

        <!-- harbour location marker on the shoreline -->
        <circle cx="600" cy="342" r="4.2" fill="none" stroke="#0E5A57" stroke-width="1.4" opacity=".7"/>
        <circle cx="600" cy="342" r="1.7" fill="#0E5A57" opacity=".9"/>

        <!-- quiet cartographic labels -->
        <text x="828" y="150" font-family="Fraunces, serif" font-style="italic"
              font-size="20" fill="#0E5A57" opacity=".75" text-anchor="middle">The Atlantic</text>
        <text x="360" y="180" font-family="Fraunces, serif" font-style="italic"
              font-size="16" fill="#0E5A57" opacity=".8" text-anchor="middle">The Island</text>
      </svg>
    </div>

    <!-- ===== Title ===== -->
    <div class="title">
      <div class="kicker">Location Report</div>
      <h1 class="serif">St Ives</h1>
      <div class="sub">Cornwall, England · TR26</div>
    </div>

    <!-- ===== One quiet headline-facts line ===== -->
    <div class="facts">
      Among the <b>sunniest in the UK</b>
      <span class="dot">·</span>
      Clean Atlantic air, <b>AQI 30</b>
      <span class="dot">·</span>
      Swimmable summer seas, <b>~17&deg;C</b>
      <span class="dot">·</span>
      Mild all year, <b>8&ndash;16&deg;C</b>
    </div>

    <div class="foot">
      <div class="credit">Location intelligence · data by <b>Boreas</b></div>
      <div>St Ives · TR26 &nbsp;—&nbsp; June 2026</div>
    </div>

  </div>
</section>

</body>
</html>
